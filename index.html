
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillMatch - Smart Job Finder</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f6ff;
    margin: 0;
    color: #172554;
}
header {
    background: #172554;
    color: white;
    padding: 25px;
    text-align: center;
}
.container {
    max-width: 600px;
    margin: 30px auto;
    padding: 20px;
    background: white;
    border-radius: 15px;
}
input {
    width: 95%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 8px;
}
button {
    background: #2563eb;
    color: white;
    padding: 13px 20px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
}
.job {
    background: #eff6ff;
    padding: 15px;
    margin-top: 12px;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>
    <h1>SkillMatch</h1>
    <p>Find Jobs Based on Your Skills & Certificates</p>
</header>

<div class="container">
    <h2>Find Your Job</h2>

    <input id="qualification" placeholder="Your Qualification">
    <input id="certificate" placeholder="Your Certificate">
    <input id="skills" placeholder="Your Skills (comma separated)">
    <input id="location" placeholder="Your Location">

    <button onclick="findJobs()">Search Jobs</button>

    <div id="results"></div>
</div>

<script>

// Sample job database
const jobs = [
    {
        title: "Electrician Trainee",
        certificate: "ITI Electrician",
        skills: ["wiring", "maintenance", "electrical"],
        location: "Telangana"
    },
    {
        title: "Electrical Technician",
        certificate: "ITI Electrician",
        skills: ["electrical", "testing", "maintenance"],
        location: "India"
    },
    {
        title: "Computer Operator",
        certificate: "Computer Certificate",
        skills: ["computer", "typing", "ms office"],
        location: "India"
    },
    {
        title: "Data Entry Operator",
        certificate: "Any Qualification",
        skills: ["typing", "computer", "data entry"],
        location: "India"
    }
];

// Job search function
function findJobs() {

    const qualification =
        document.getElementById("qualification").value.trim().toLowerCase();

    const certificate =
        document.getElementById("certificate").value.trim().toLowerCase();

    const skills =
        document.getElementById("skills").value.trim().toLowerCase();

    const location =
        document.getElementById("location").value.trim().toLowerCase();

    const results = document.getElementById("results");

    results.innerHTML = "";

    if (!qualification || !skills) {
        results.textContent = "Please enter your qualification and skills.";
        return;
    }

    const userSkills = skills.split(",").map(s => s.trim());

    const matches = jobs.map(job => {

        let score = 0;

        // Match skills
        job.skills.forEach(skill => {
            if (userSkills.some(s => s.includes(skill))) {
                score += 1;
            }
        });

        // Match certificate
        if (
            certificate.includes(job.certificate.toLowerCase()) ||
            job.certificate === "Any Qualification"
        ) {
            score += 2;
        }

        // Match qualification (basic demo check)
        if (
            qualification.includes("iti") &&
            job.certificate.toLowerCase().includes("iti")
        ) {
            score += 1;
        }

        // Match location
        if (
            location &&
            (job.location.toLowerCase() === location ||
             job.location.toLowerCase() === "india")
        ) {
            score += 1;
        }

        return { job, score };

    })
    .filter(item => item.score > 0)
    .sort((a, b) => b.score - a.score);

    const heading = document.createElement("h2");
    heading.textContent = "Matching Jobs";
    results.appendChild(heading);

    if (matches.length === 0) {
        results.append("No matching sample jobs found. Try different skills.");
        return;
    }

    matches.forEach(item => {

        const card = document.createElement("div");
        card.className = "job";

        const title = document.createElement("h3");
        title.textContent = item.job.title;

        const details = document.createElement("p");
        details.textContent =
            "Required Certificate: " + item.job.certificate;

        const jobSkills = document.createElement("p");
        jobSkills.textContent =
            "Required Skills: " + item.job.skills.join(", ");

        const jobLocation = document.createElement("p");
        jobLocation.textContent =
            "Location: " + item.job.location;

        const score = document.createElement("p");
        score.textContent =
            "Demo Match Points: " + item.score;

        const note = document.createElement("p");
        note.innerHTML = "<b>Sample listing - not a live vacancy.</b>";

        card.append(
            title,
            details,
            jobSkills,
            jobLocation,
            score,
            note
        );

        results.appendChild(card);
    });
}

</script>

</body>
</html>
