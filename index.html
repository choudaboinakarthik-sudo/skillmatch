
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillMatch - Smart Job Finder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6ff;
            margin: 0;
            color: #172554;
        }
        header {
            background: #172554;
            color: white;
            padding: 25px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
        }
        input {
            width: 95%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        button {
            background: #2563eb;
            color: white;
            padding: 13px 20px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }
        .job {
            background: #eff6ff;
            padding: 15px;
            margin-top: 12px;
            border-radius: 10px;
        }
   
const jobs = [
  {
    title: "Electrician Trainee",
    certificate: "ITI Electrician",
    skills: ["wiring", "maintenance", "electrical"],
    location: "Telangana"
  },
  {
    title: "Electrical Technician",
    certificate: "ITI Electrician",
    skills: ["electrical", "testing", "maintenance"],
    location: "India"
  },
  {
    title: "Computer Operator",
    certificate: "Computer Certificate",
    skills: ["computer", "typing", "ms office"],
    location: "India"
  },
  {
    title: "Data Entry Operator",
    certificate: "Any Qualification",
    skills: ["typing", "computer", "data entry"],
    location: "India"
  }
];

function findJobs() {
  const qualification =
    document.getElementById("qualification").value.toLowerCase();

  const certificate =
    document.getElementById("certificate").value.toLowerCase();

  const skills =
    document.getElementById("skills").value.toLowerCase();

  const location =
    document.getElementById("location").value.toLowerCase();

  const results = document.getElementById("results");
  results.innerHTML = "";

  if (!qualification || !skills) {
    results.textContent = "Enter your qualification and skills.";
    return;
  }

  const userSkills = skills.split(",").map(s => s.trim());

  const matches = jobs.map(job => {
    let score = 0;

    job.skills.forEach(skill => {
      if (userSkills.some(s => s.includes(skill))) {
        score += 1;
      }
    });

    if (certificate.includes(job.certificate.toLowerCase()) ||
        job.certificate === "Any Qualification") {
      score += 2;
    }

    return { job, score };
  }).filter(item => item.score > 0)
    .sort((a, b) => b.score - a.score);

  const heading = document.createElement("h2");
  heading.textContent = "Matching Jobs";
  results.appendChild(heading);

  if (matches.length === 0) {
    results.append("No matching sample jobs found. Try different skills.");
    return;
  }

  matches.forEach(item => {
    const card = document.createElement("div");
    card.className = "job";

    const title = document.createElement("h3");
    title.textContent = item.job.title;

    const details = document.createElement("p");
    details.textContent =
      "Required certificate: " + item.job.certificate;

    const score = document.createElement("p");
    score.textContent = "Demo match points: " + item.score;

    const note = document.createElement("p");
    note.textContent = "Sample listing - not a live vacancy.";

    card.append(title, details, score, note);
    results.appendChild(card);
  });
}


</body>
</html>
